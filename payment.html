<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17486f"><title>Nova Dental Lab - الدفع والتحويل</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef5fb,#f9fbfd);font-family:Arial,Tahoma,sans-serif;color:#17202a;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(520px,100%);background:#fff;border:1px solid #dbe5ee;border-radius:26px;padding:30px 22px;box-shadow:0 18px 55px rgba(23,72,111,.13);text-align:center}.logo{width:70px;height:70px;margin:0 auto 13px;border:2px solid #17486f;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#17486f;font-size:32px;font-weight:900}.brand{margin:0;color:#17486f;font-size:29px}.sub{margin:7px 0 24px;color:#687789;font-size:15px}.label{font-size:13px;color:#687789;margin-bottom:7px}.number{direction:ltr;font-size:30px;font-weight:900;letter-spacing:1px;background:#f4f8fb;border:1px solid #d9e5ee;border-radius:14px;padding:15px 8px}.copy{width:100%;margin-top:12px;border:0;border-radius:12px;padding:14px;background:#17486f;color:white;font-size:16px;font-weight:800;cursor:pointer}.methods{text-align:right;margin:25px 0 18px}.methods h2{font-size:18px;margin:0 0 12px}.method{display:flex;align-items:center;gap:10px;border:1px solid #e0e7ed;border-radius:13px;padding:13px;margin:8px 0;font-weight:800}.dot{width:14px;height:14px;border-radius:50%;display:inline-block}.vod{background:#7b2cbf}.insta{background:#2874f0}.warning{margin-top:20px;padding:14px;border-radius:13px;background:#fff7e6;border:1px solid #f0d69a;color:#7a5715;font-weight:800;line-height:1.7}.footer{margin-top:20px;color:#8793a1;font-size:12px}@media(max-width:420px){.card{padding:25px 16px}.brand{font-size:25px}.number{font-size:25px}}</style></head><body><main class="card"><div class="logo">N</div><h1 class="brand">Nova Dental Lab</h1><div class="sub">لاب الأسنان</div><div class="label">رقم التحويل</div><div class="number" id="number">01011645139</div><button class="copy" id="copy">نسخ الرقم</button><section class="methods"><h2>يمكن التحويل على الرقم عن طريق:</h2><div class="method"><span class="dot vod"></span> فودافون كاش</div><div class="method"><span class="dot insta"></span> إنستا باي</div></section><div class="warning">⚠️ برجاء التأكد من اسم المستلم قبل التحويل.</div><div class="footer">يرجى مراجعة الرقم واسم المستلم قبل تأكيد التحويل.<br>Nova Dental Lab — لاب الأسنان</div></main><script>document.getElementById('copy').onclick=async()=>{const n=document.getElementById('number').textContent.trim(),b=document.getElementById('copy');try{await navigator.clipboard.writeText(n)}catch(e){const t=document.createElement('textarea');t.value=n;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}b.textContent='تم نسخ الرقم ✓';setTimeout(()=>b.textContent='نسخ الرقم',1600)};</script></body></html>
